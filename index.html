<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FED700">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Fumigación PF Rosa - Semana 2640</title>
  <style>
    :root {
      --bg-yellow: #FED700;
      --card-blue: #3247C5;
      --card-blue-hover: #24359D;
      --card-blue-active: #1D2C87;
      --border-dark: #000000;
      --text-dark: #000000;
      --modal-bg: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-yellow);
      min-height: 100vh;
      color: var(--text-dark);
      padding: 16px 12px 60px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
    }

    /* Minimalist Header */
    .header-bar {
      width: 100%;
      max-width: 580px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      background: #FFFFFF;
      border: 3.5px solid var(--border-dark);
      box-shadow: 4px 4px 0px #000000;
      padding: 12px 14px;
      gap: 10px;
    }

    .header-title {
      font-size: 1.18rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #000000;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-semana-actual {
      background-color: #1e7e34;
      color: #FFFFFF;
      font-size: 0.88rem;
      font-weight: 900;
      padding: 6px 12px;
      border: 2.5px solid var(--border-dark);
      box-shadow: 2px 2px 0px #000000;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Blocks Container */
    .blocks-container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Block Card - Mobile Ergonomic & Touch Optimized */
    .block-card {
      background-color: var(--card-blue);
      border: 3.5px solid var(--border-dark);
      box-shadow: 4px 4px 0px rgba(0, 0, 0, 1);
      min-height: 80px;
      padding: 18px 14px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.08s ease, background-color 0.1s ease, box-shadow 0.08s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .block-card:hover {
      background-color: var(--card-blue-hover);
    }

    .block-card:active {
      background-color: var(--card-blue-active);
      transform: translateY(2px) scale(0.99);
      box-shadow: 1px 1px 0px rgba(0, 0, 0, 1);
    }

    .block-card .block-title {
      font-size: 1.65rem;
      font-weight: 900;
      color: #000000;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Modal / Pop-up Overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(4px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 14px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-window {
      background: var(--modal-bg);
      border: 4px solid var(--border-dark);
      box-shadow: 6px 8px 0px rgba(0, 0, 0, 1);
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 4px;
    }

    .modal-header {
      background: var(--card-blue);
      border-bottom: 3.5px solid var(--border-dark);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .modal-header .header-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .modal-header .header-bloque {
      font-size: 1.5rem;
      font-weight: 900;
      color: #000000;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      background: #FED700;
      padding: 3px 10px;
      border: 2.5px solid #000;
      display: inline-block;
      width: fit-content;
      box-shadow: 2px 2px 0px #000;
    }

    .modal-header .header-sub {
      font-size: 0.88rem;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .btn-close-modal {
      background: #FFFFFF;
      color: #000000;
      border: 3px solid var(--border-dark);
      font-size: 1.6rem;
      font-weight: 900;
      width: 44px;
      height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
      flex-shrink: 0;
    }

    .btn-close-modal:active {
      background: #FF3838;
      color: #FFFFFF;
    }

    .modal-body {
      padding: 16px 14px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background-color: #F4F6F9;
    }

    /* DAY SECTION: Individual colors per day */
    .day-section {
      border: 3px solid #000000;
      box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.9);
      padding: 14px 12px;
      border-radius: 2px;
    }

    .day-title {
      font-size: 1.15rem;
      font-weight: 900;
      color: #000000;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 2.5px solid #000000;
      padding-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .day-badge {
      font-size: 0.78rem;
      font-weight: 900;
      margin-left: auto;
      padding: 3px 8px;
      border: 2px solid #000000;
      box-shadow: 1.5px 1.5px 0px #000000;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* Day Theme Backgrounds */
    .day-section.day-lunes {
      background-color: #DDF1FF;
      border-top: 7px solid #0284C7;
    }
    .day-section.day-lunes .day-badge {
      background-color: #0284C7;
      color: #FFFFFF;
    }

    .day-section.day-martes {
      background-color: #FFEADB;
      border-top: 7px solid #EA580C;
    }
    .day-section.day-martes .day-badge {
      background-color: #EA580C;
      color: #FFFFFF;
    }

    .day-section.day-miercoles {
      background-color: #DCFCE7;
      border-top: 7px solid #16A34A;
    }
    .day-section.day-miercoles .day-badge {
      background-color: #16A34A;
      color: #FFFFFF;
    }

    .day-section.day-jueves {
      background-color: #F3E8FF;
      border-top: 7px solid #9333EA;
    }
    .day-section.day-jueves .day-badge {
      background-color: #9333EA;
      color: #FFFFFF;
    }

    .day-section.day-viernes {
      background-color: #FFE4E6;
      border-top: 7px solid #E11D48;
    }
    .day-section.day-viernes .day-badge {
      background-color: #E11D48;
      color: #FFFFFF;
    }

    .day-section.day-sabado {
      background-color: #FEF9C3;
      border-top: 7px solid #CA8A04;
    }
    .day-section.day-sabado .day-badge {
      background-color: #FED700;
      color: #000000;
    }

    .day-section.day-domingo {
      background-color: #E2E8F0;
      border-top: 7px solid #475569;
    }
    .day-section.day-domingo .day-badge {
      background-color: #475569;
      color: #FFFFFF;
    }

    .day-section.day-default {
      background-color: #FFFFFF;
      border-top: 7px solid #000000;
    }

    .products-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .product-item {
      background: #FFFFFF;
      border: 2px solid #000000;
      box-shadow: 2.5px 2.5px 0px rgba(0, 0, 0, 0.85);
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .product-name {
      font-size: 1.02rem;
      font-weight: 900;
      color: #000000;
      letter-spacing: 0.2px;
      word-break: break-word;
      line-height: 1.25;
    }

    .product-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .product-dosis {
      font-size: 0.82rem;
      font-weight: 900;
      background: #FFFFFF;
      color: #000000;
      padding: 3px 8px;
      border: 2px solid #000000;
      white-space: nowrap;
      box-shadow: 1.5px 1.5px 0px #000000;
    }

    /* TOX CATEGORY BADGES */
    .product-tox {
      font-size: 0.8rem;
      font-weight: 900;
      padding: 3px 7px;
      border: 2px solid #000000;
      white-space: nowrap;
      box-shadow: 1.5px 1.5px 0px #000000;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .tox-i {
      background-color: #FF3B30;
      color: #FFFFFF;
    }

    .tox-ii {
      background-color: #FFCC00;
      color: #000000;
    }

    .tox-iii {
      background-color: #007AFF;
      color: #FFFFFF;
    }

    .tox-iv {
      background-color: #34C759;
      color: #000000;
    }

    .tox-na {
      background-color: #E5E5EA;
      color: #1C1C1E;
    }

    .tox-other {
      background-color: #E5E5EA;
      color: #000000;
    }

    .no-data-msg {
      text-align: center;
      padding: 24px 16px;
      font-weight: 800;
      color: #000000;
      background: #FFFFFF;
      border: 3px dashed var(--border-dark);
      box-shadow: 3px 3px 0px #000;
      font-size: 0.95rem;
    }

    .modal-footer {
      background: #FFFFFF;
      border-top: 3.5px solid var(--border-dark);
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .nav-btn {
      background: #F1F5F9;
      border: 2.5px solid var(--border-dark);
      font-weight: 900;
      font-size: 0.88rem;
      height: 44px;
      padding: 0 16px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 2px 2px 0px #000;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      transition: all 0.08s;
    }

    .nav-btn:active:not(:disabled) {
      background: #FED700;
      transform: translateY(1px);
      box-shadow: 1px 1px 0px #000;
    }

    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ========================================================
       MOBILE-FIRST OPTIMIZATIONS (< 640px)
       ======================================================== */
    @media (max-width: 640px) {
      body {
        padding: 10px 8px 30px 8px;
      }

      .header-bar {
        padding: 10px 12px;
        margin-bottom: 12px;
      }

      .header-title {
        font-size: 1.05rem;
      }

      .badge-semana-actual {
        font-size: 0.78rem;
        padding: 5px 8px;
      }

      .blocks-container {
        gap: 10px;
      }

      .block-card {
        min-height: 72px;
        padding: 16px 12px;
        border-width: 3.5px;
        box-shadow: 3.5px 3.5px 0px #000;
      }

      .block-card .block-title {
        font-size: 1.45rem;
      }

      /* Modal acts as a smooth bottom-sheet / full viewport on phone */
      .modal-overlay {
        padding: 0;
        align-items: flex-end;
      }

      .modal-window {
        max-width: 100%;
        height: 92vh;
        max-height: 92vh;
        border-bottom: none;
        border-left: none;
        border-right: none;
        border-top: 4.5px solid #000;
        border-radius: 12px 12px 0 0;
        box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.45);
        animation: slideUpMobile 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes slideUpMobile {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
      }

      .modal-header {
        padding: 12px 14px;
        border-radius: 8px 8px 0 0;
      }

      .modal-header .header-bloque {
        font-size: 1.35rem;
      }

      .btn-close-modal {
        width: 40px;
        height: 40px;
        font-size: 1.4rem;
      }

      .modal-body {
        padding: 12px 10px;
        gap: 12px;
      }

      .day-section {
        padding: 12px 10px;
      }

      .day-title {
        font-size: 1.05rem;
        margin-bottom: 10px;
      }

      .product-item {
        padding: 10px;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .product-name {
        font-size: 1rem;
      }

      .product-badges {
        width: 100%;
        justify-content: flex-start;
        gap: 6px;
      }

      .product-tox, .product-dosis {
        font-size: 0.8rem;
        padding: 3px 7px;
      }

      .modal-footer {
        padding: 10px 12px;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
      }

      .nav-btn {
        height: 42px;
        font-size: 0.82rem;
      }
    }
  </style>
</head>

    function getDayColorClass(dia) {
      const d = String(dia || '').toLowerCase();
      if (d.includes('lun')) return 'day-lunes';
      if (d.includes('mar')) return 'day-martes';
      if (d.includes('mi')) return 'day-miercoles';
      if (d.includes('jue')) return 'day-jueves';
      if (d.includes('vie')) return 'day-viernes';
      if (d.includes('s') && (d.includes('bado') || d.includes('ba'))) return 'day-sabado';
      if (d.includes('dom')) return 'day-domingo';
      return 'day-default';
    }

    function getToxBadgeHTML(rawTox) {
      if (!rawTox) return '';
      let t = String(rawTox).trim().toUpperCase();
      if (!t || t === 'NA' || t === 'N/A' || t === 'N.A.') {
        return '<span class="product-tox tox-na">TOX: N/A</span>';
      }
      if (t.includes('IV')) {
        return '<span class="product-tox tox-iv">TOX: IV</span>';
      }
      if (t.includes('III') || t.includes('I I I')) {
        return '<span class="product-tox tox-iii">TOX: III</span>';
      }
      if (t.includes('II') || t.includes('I I')) {
        return '<span class="product-tox tox-ii">TOX: II</span>';
      }
      if (t === 'I') {
        return '<span class="product-tox tox-i">TOX: I</span>';
      }
      return '<span class="product-tox tox-other">TOX: ' + t + '</span>';
    }

    // Auto-fetch Backup_Fumigacion.sql when hosted on GitHub Pages or web server
    async function autoCargarDesdeSQL() {
      const posiblesArchivos = ['Backup_Fumigacion.sql', './Backup_Fumigacion.sql'];
      for (let ruta of posiblesArchivos) {
        try {
          const resp = await fetch(ruta);
          if (resp.ok) {
            const sqlText = await resp.text();
            if (sqlText && sqlText.includes('VALUES (1, ')) {
              procesarSQL(sqlText);
              return true;
            }
          }
        } catch (e) {
          // Local fallback
        }
      }
      return false;
    }

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') cerrarModal();
        if (document.getElementById('modalOverlay').classList.contains('active')) {
          if (e.key === 'ArrowLeft') navegarBloque(-1);
          if (e.key === 'ArrowRight') navegarBloque(1);
        }
      });

      autoCargarDesdeSQL();

    function cleanDayJS(d) {
      if (!d) return 'Sin día';
      d = String(d).trim();
      if (d.includes('Mi')) return 'Miércoles';
      if (d.includes('bado') || (d.includes('S') && d.includes('do'))) return 'Sábado';
      if (d.includes('Lun')) return 'Lunes';
      if (d.includes('Mar')) return 'Martes';
      if (d.includes('Jue')) return 'Jueves';
      if (d.includes('Vie')) return 'Viernes';
      if (d.includes('Dom')) return 'Domingo';
      return d;
    }

    function normalizeBlockJS(b) {
      if (!b) return 'Sin Bloque';
      let norm = String(b).trim();
      if (norm === 'BLOQUE 12CO') return 'BLOQUE 12 CO';
      if (norm === 'BLOQUE 12FD') return 'BLOQUE 12 FD';
      if (norm === 'BLOQUE BLOQUE 25B') return 'BLOQUE 25B';
      return norm;
    }

    function procesarSQL(content) {
      let jsonStr = '';
      const prefix = "VALUES (1, '";
      const idx = content.indexOf(prefix);
      if (idx !== -1) {
        const start = idx + prefix.length;
        let end = content.lastIndexOf("');");
        if (end === -1) end = content.lastIndexOf("'");
        jsonStr = content.substring(start, end);
      } else {
        const first = content.indexOf('{');
        const last = content.lastIndexOf('}');
        if (first !== -1 && last !== -1) {
          jsonStr = content.substring(first, last + 1);
        }
      }

      if (!jsonStr) return;

      let parsed = null;
      try {
        parsed = JSON.parse(jsonStr);
      } catch (e1) {
        try {
          let fixed = jsonStr.replace(/\\'/g, "'").replace(/''/g, "'");
          parsed = JSON.parse(fixed);
        } catch (e2) {
          return;
        }
      }

      const hist = parsed.historicoOperativo || {};
      const op = parsed.operativoData || [];

      const newSchedule = {};

      for (let bName in hist) {
        const normB = normalizeBlockJS(bName);
        const bVal = hist[bName];
        if (typeof bVal === 'object' && bVal !== null) {
          for (let k in bVal) {
            const items = bVal[k];
            if (Array.isArray(items)) {
              items.forEach(it => {
                const w = String(it.semanaAplicacion || it.semana || '').trim();
                if (w !== currentWeek) return;
                const dia = cleanDayJS(it.dia);
                const prod = String(it.producto || 'Sin producto').trim();
                const dosis = it.dosis;
                const tox = String(it.tox || 'N/A').trim();

                if (!newSchedule[normB]) newSchedule[normB] = {};
                if (!newSchedule[normB][dia]) newSchedule[normB][dia] = [];

                newSchedule[normB][dia].push({
                  producto: prod,
                  dosis: dosis,
                  tox: tox
                });
              });
            }
          }
        }
      }

      if (Array.isArray(op)) {
        op.forEach(it => {
          const w = String(it.semanaAplicacion || it.semana || '').trim();
          if (w !== currentWeek) return;
          const bName = normalizeBlockJS(it.bloque || 'Sin Bloque');
          const dia = cleanDayJS(it.dia);
          const prod = String(it.producto || 'Sin producto').trim();
          const dosis = it.dosis;
          const tox = String(it.tox || 'N/A').trim();

          if (!newSchedule[bName]) newSchedule[bName] = {};
          if (!newSchedule[bName][dia]) newSchedule[bName][dia] = [];

          newSchedule[bName][dia].push({
            producto: prod,
            dosis: dosis,
            tox: tox
          });
        });
      }

      appData.scheduleData[currentWeek] = newSchedule;
      renderBloques();
    }

    function renderBloques() {
      const container = document.getElementById('blocksContainer');
      container.innerHTML = '';

      visibleBloques.forEach((bloqueName, index) => {
        const card = document.createElement('div');
        card.className = 'block-card';
        card.onclick = () => abrirModal(bloqueName, index);

        const title = document.createElement('div');
        title.className = 'block-title';
        title.textContent = bloqueName;

        card.appendChild(title);
        container.appendChild(card);
      });
    }

    function abrirModal(bloqueName, index) {
      if (typeof index === 'number') {
        currentBloqueIndex = index;
      } else {
        currentBloqueIndex = visibleBloques.indexOf(bloqueName);
      }

      document.getElementById('modalBloqueTitle').textContent = bloqueName;

      document.getElementById('btnPrevBlock').disabled = (currentBloqueIndex <= 0);
      document.getElementById('btnNextBlock').disabled = (currentBloqueIndex >= visibleBloques.length - 1);

      const semanaData = (appData.scheduleData && appData.scheduleData[currentWeek]) || {};
      const bloqueData = semanaData[bloqueName] || {};

      const modalBody = document.getElementById('modalBody');
      modalBody.innerHTML = '';

      const diasEncontrados = Object.keys(bloqueData);

      if (diasEncontrados.length === 0) {
        modalBody.innerHTML = `
          <div class="no-data-msg">
            <p style="font-size: 1.1rem; margin-bottom: 6px;">ℹ️ Sin aplicaciones registradas</p>
            <p>No se encontraron productos programados para <strong>${bloqueName}</strong> en la <strong>Semana ${currentWeek}</strong>.</p>
          </div>
        `;
      } else {
        diasEncontrados.sort((a, b) => {
          let idxA = DAY_ORDER.indexOf(a);
          let idxB = DAY_ORDER.indexOf(b);
          if (idxA === -1) idxA = 99;
          if (idxB === -1) idxB = 99;
          return idxA - idxB;
        });

        diasEncontrados.forEach(dia => {
          const productos = bloqueData[dia] || [];
          const daySec = document.createElement('div');
          
          const dayColorClass = getDayColorClass(dia);
          daySec.className = 'day-section ' + dayColorClass;

          const dayHeader = document.createElement('div');
          dayHeader.className = 'day-title';
          dayHeader.innerHTML = `
            <span>📅 ${dia}</span>
            <span class="day-badge">${productos.length} ${productos.length === 1 ? 'PRODUCTO' : 'PRODUCTOS'}</span>
          `;
          daySec.appendChild(dayHeader);

          const list = document.createElement('ul');
          list.className = 'products-list';

          productos.forEach(p => {
            const li = document.createElement('li');
            li.className = 'product-item';

            const prodName = document.createElement('div');
            prodName.className = 'product-name';
            prodName.textContent = p.producto;

            const badgesWrapper = document.createElement('div');
            badgesWrapper.className = 'product-badges';

            const toxHTML = getToxBadgeHTML(p.tox);
            if (toxHTML) {
              const toxSpan = document.createElement('span');
              toxSpan.innerHTML = toxHTML;
              badgesWrapper.appendChild(toxSpan.firstElementChild);
            }

            if (p.dosis !== null && p.dosis !== undefined && p.dosis !== '') {
              const dosisBadge = document.createElement('span');
              dosisBadge.className = 'product-dosis';
              dosisBadge.textContent = 'Dosis: ' + p.dosis;
              badgesWrapper.appendChild(dosisBadge);
            }

            li.appendChild(prodName);
            li.appendChild(badgesWrapper);
            list.appendChild(li);
          });

          daySec.appendChild(list);
          modalBody.appendChild(daySec);
        });
      }

      document.getElementById('modalOverlay').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function cerrarModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    function handleOverlayClick(event) {
      if (event.target.id === 'modalOverlay') {
        cerrarModal();
      }
    }

    function navegarBloque(direction) {
      const newIndex = currentBloqueIndex + direction;
      if (newIndex >= 0 && newIndex < visibleBloques.length) {
        abrirModal(visibleBloques[newIndex], newIndex);
      }
    }

    window.onload = initApp;
  </script>
</body>
</html>
